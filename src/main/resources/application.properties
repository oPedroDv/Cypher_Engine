spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cypher}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.threads.virtual.enabled=true

resilience4j.circuitbreaker.instances.sefaz.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sefaz.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sefaz.sliding-window-size=10
resilience4j.circuitbreaker.instances.sefaz.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.receita-federal.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.receita-federal.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.receita-federal.sliding-window-size=10

management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.show-details=when-authorized

cypher.storage.type=${STORAGE_TYPE:local}
cypher.storage.local-path=${STORAGE_LOCAL_PATH:/tmp/cypher/xmls}

cypher.security.jwt.secret=${JWT_SECRET}
cypher.security.jwt.issuer=${JWT_ISSUER}
cypher.security.jwt.audience=${JWT_AUDIENCE}
cypher.security.dev-token.enabled=${DEV_TOKEN_ENABLED:false}
cypher.security.dev-token.tenant-id=${DEV_TOKEN_TENANT_ID:}

cypher.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:3s}
cypher.http.read-timeout=${HTTP_READ_TIMEOUT:10s}
cypher.http.max-request-bytes=${MAX_REQUEST_BYTES:1500000}
cypher.nfe.require-signature=${NFE_REQUIRE_SIGNATURE:true}
cypher.nfe.trust-store.path=${NFE_TRUST_STORE_PATH:}
cypher.nfe.trust-store.password=${NFE_TRUST_STORE_PASSWORD:}

server.tomcat.max-http-form-post-size=${MAX_REQUEST_BYTES:1500000}
server.tomcat.max-swallow-size=${MAX_REQUEST_BYTES:1500000}

sefaz.enabled=${SEFAZ_ENABLED:false}
sefaz.url=${SEFAZ_URL:}
receita-federal.url=${RECEITA_FEDERAL_URL:https://brasilapi.com.br/api/cnpj/v1}
