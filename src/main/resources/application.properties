spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cypher}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.threads.virtual.enabled=true

resilience4j.circuitbreaker.instances.sefaz.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sefaz.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sefaz.sliding-window-size=10
resilience4j.circuitbreaker.instances.sefaz.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.receita-federal.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.receita-federal.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.receita-federal.sliding-window-size=10

management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.show-details=when-authorized

cypher.storage.type=${STORAGE_TYPE:local}
cypher.storage.local-path=${STORAGE_LOCAL_PATH:/tmp/cypher/xmls}

cypher.security.jwt.secret=${JWT_SECRET:dev-secret-local-apenas-para-testes}