spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cypher}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.threads.virtual.enabled=true

resilience4j.circuitbreaker.instances.sefaz.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sefaz.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.sefaz.sliding-window-size=10
resilience4j.circuitbreaker.instances.sefaz.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.receita-federal.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.receita-federal.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.receita-federal.sliding-window-size=10

management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.show-details=when-authorized

cypher.storage.type=${STORAGE_TYPE:local}
cypher.storage.local-path=${STORAGE_LOCAL_PATH:/tmp/cypher/xmls}

cypher.persistence.write-timeout-seconds=${PERSISTENCE_WRITE_TIMEOUT_SECONDS:15}

cypher.security.jwt.secret=${JWT_SECRET}
cypher.security.jwt.issuer=${JWT_ISSUER}
cypher.security.jwt.audience=${JWT_AUDIENCE}
cypher.security.dev-token.enabled=${DEV_TOKEN_ENABLED:false}
cypher.security.dev-token.tenant-id=${DEV_TOKEN_TENANT_ID:}
cypher.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cypher.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:3s}
cypher.http.read-timeout=${HTTP_READ_TIMEOUT:10s}
cypher.http.max-request-bytes=${MAX_REQUEST_BYTES:1500000}
cypher.http.check-revocation=${HTTP_CHECK_REVOCATION:true}
cypher.nfe.require-signature=${NFE_REQUIRE_SIGNATURE:true}
cypher.nfe.trust-store.path=${NFE_TRUST_STORE_PATH:}
cypher.nfe.trust-store.password=${NFE_TRUST_STORE_PASSWORD:}

server.tomcat.max-http-form-post-size=${MAX_REQUEST_BYTES:1500000}
server.tomcat.max-swallow-size=${MAX_REQUEST_BYTES:1500000}

sefaz.enabled=${SEFAZ_ENABLED:false}
sefaz.url=${SEFAZ_URL:}
receita-federal.enabled=${RECEITA_FEDERAL_ENABLED:true}
receita-federal.url=${RECEITA_FEDERAL_URL:https://brasilapi.com.br/api/cnpj/v1}

cypher.risk.issuer-high-threshold=${RISK_ISSUER_HIGH_THRESHOLD:0.15}
cypher.risk.issuer-critical-threshold=${RISK_ISSUER_CRITICAL_THRESHOLD:0.30}
cypher.risk.issuer-high-floor=${RISK_ISSUER_HIGH_FLOOR:0.70}
cypher.risk.issuer-critical-floor=${RISK_ISSUER_CRITICAL_FLOOR:0.85}
cypher.risk.payer-high-threshold=${RISK_PAYER_HIGH_THRESHOLD:0.10}
cypher.risk.payer-critical-threshold=${RISK_PAYER_CRITICAL_THRESHOLD:0.25}
cypher.risk.payer-high-floor=${RISK_PAYER_HIGH_FLOOR:0.70}
cypher.risk.payer-critical-floor=${RISK_PAYER_CRITICAL_FLOOR:0.90}
cypher.risk.value-anomaly-high-ratio=${RISK_VALUE_ANOMALY_HIGH_RATIO:5.0}
cypher.risk.value-anomaly-critical-ratio=${RISK_VALUE_ANOMALY_CRITICAL_RATIO:8.0}
cypher.risk.value-anomaly-high-floor=${RISK_VALUE_ANOMALY_HIGH_FLOOR:0.65}
cypher.risk.value-anomaly-critical-floor=${RISK_VALUE_ANOMALY_CRITICAL_FLOOR:0.75}
cypher.risk.default-advance-ratio=${RISK_DEFAULT_ADVANCE_RATIO:0.90}
cypher.risk.pair-high-threshold=${RISK_PAIR_HIGH_THRESHOLD:0.05}
cypher.risk.pair-critical-threshold=${RISK_PAIR_CRITICAL_THRESHOLD:0.15}
cypher.risk.pair-high-floor=${RISK_PAIR_HIGH_FLOOR:0.65}
cypher.risk.pair-critical-floor=${RISK_PAIR_CRITICAL_FLOOR:0.85}
cypher.risk.payer-late-threshold=${RISK_PAYER_LATE_THRESHOLD:0.30}
cypher.risk.payer-late-floor=${RISK_PAYER_LATE_FLOOR:0.60}
cypher.risk.source-unavailable-penalty=${RISK_SOURCE_UNAVAILABLE_PENALTY:0.10}
cypher.risk.source-unavailable-floor=${RISK_SOURCE_UNAVAILABLE_FLOOR:0.35}
cypher.risk.external-validation-floor=${RISK_EXTERNAL_VALIDATION_FLOOR:0.20}
cypher.risk.external-validation-unknown-floor=${RISK_EXTERNAL_VALIDATION_UNKNOWN_FLOOR:0.25}
cypher.risk.issuer-closed-floor=${RISK_ISSUER_CLOSED_FLOOR:0.90}
cypher.risk.payer-closed-floor=${RISK_PAYER_CLOSED_FLOOR:0.80}
cypher.risk.issuer-unfit-floor=${RISK_ISSUER_UNFIT_FLOOR:0.80}
cypher.risk.payer-unfit-floor=${RISK_PAYER_UNFIT_FLOOR:0.70}
cypher.risk.issuer-suspended-floor=${RISK_ISSUER_SUSPENDED_FLOOR:0.65}
cypher.risk.payer-suspended-floor=${RISK_PAYER_SUSPENDED_FLOOR:0.55}
cypher.risk.sefaz-blocked-floor=${RISK_SEFAZ_BLOCKED_FLOOR:0.95}
cypher.risk.sefaz-pending-floor=${RISK_SEFAZ_PENDING_FLOOR:0.70}
cypher.risk.sefaz-unavailable-floor=${RISK_SEFAZ_UNAVAILABLE_FLOOR:0.45}
cypher.risk.missing-maturity-floor=${RISK_MISSING_MATURITY_FLOOR:0.40}
cypher.risk.overdue-maturity-floor=${RISK_OVERDUE_MATURITY_FLOOR:0.75}
cypher.risk.near-maturity-days=${RISK_NEAR_MATURITY_DAYS:3}
cypher.risk.near-maturity-floor=${RISK_NEAR_MATURITY_FLOOR:0.60}
cypher.risk.financial-loss-multiplier=${RISK_FINANCIAL_LOSS_MULTIPLIER:0.18}
cypher.risk.financial-advance-haircut=${RISK_FINANCIAL_ADVANCE_HAIRCUT:0.15}
cypher.risk.financial-max-advance-ratio=${RISK_FINANCIAL_MAX_ADVANCE_RATIO:0.95}
cypher.risk.financial-rate-risk-premium=${RISK_FINANCIAL_RATE_RISK_PREMIUM:2.50}
